version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chattermate-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./chatbot.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
    volumes:
      - ./backend:/app
      - chatbot-data:/app/data
    restart: unless-stopped
    networks:
      - chattermate-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chattermate-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chattermate-network

volumes:
  chatbot-data:

networks:
  chattermate-network:
    driver: bridge
